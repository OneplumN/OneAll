server {
    listen 80;
    listen [::]:80;
    server_name regex.oneplums.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name regex.oneplums.cn;

    root /var/www/regex.oneplums.cn;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/regex.oneplums.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/regex.oneplums.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
